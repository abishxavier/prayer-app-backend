name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: jarvis10-497811
  SERVICE_NAME: prayer-app-backend
  REGION: asia-south1
  IMAGE: gcr.io/jarvis10-497811/prayer-app-backend

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud credentials
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .

      - name: Push Docker image to GCR
        run: |
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},FIREBASE_CREDENTIALS_PATH=app/core/firebase-service-account.json,AGORA_APP_ID=${{ secrets.AGORA_APP_ID }},AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}" \
            --port 8080 \
            --timeout 60 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3
